    // ==========================================
    // 3. BỘ TẠO ÂM THANH & NHẠC NỀN GAMESHOW (WEB AUDIO API)
    // ==========================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.bgmTimer = null;
        this.isBgmPlaying = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.ctx = new AudioContextClass();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, duration, type = "sine", gainLevel = 0.12) {
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(gainLevel, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.warn("Audio play prevented:", e);
        }
      }

      playCorrect(enabled) {
        if (!enabled) return;
        this.playTone(523.25, 0.1, "triangle", 0.15); // C5
        setTimeout(() => this.playTone(659.25, 0.12, "triangle", 0.15), 90); // E5
        setTimeout(() => this.playTone(783.99, 0.25, "triangle", 0.18), 180); // G5
      }

      playWrong(enabled) {
        if (!enabled) return;
        this.playTone(220, 0.18, "sawtooth", 0.18);
        setTimeout(() => this.playTone(174.61, 0.3, "sawtooth", 0.18), 120);
      }

      playTick(enabled) {
        if (!enabled) return;
        this.playTone(800, 0.04, "sine", 0.05);
      }

      playCheer(enabled) {
        if (!enabled) return;
        [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 0.35, "sine", 0.2), idx * 120);
        });
      }

      startBGM(enabled) {
        if (!enabled || this.isBgmPlaying) return;
        this.init();
        this.isBgmPlaying = true;
        const notes = [130.81, 146.83, 164.81, 174.61, 196.00]; // Bass pattern
        let step = 0;
        this.bgmTimer = setInterval(() => {
          if (!this.isBgmPlaying) return;
          const f = notes[step % notes.length];
          this.playTone(f, 0.22, "sine", 0.035);
          step++;
        }, 550);
      }

      stopBGM() {
        this.isBgmPlaying = false;
        if (this.bgmTimer) {
          clearInterval(this.bgmTimer);
          this.bgmTimer = null;
        }
      }
    }

    const soundManager = new SoundEngine();

    // ==========================================
    // 4. GIAO DIỆN REACT GAMESHOW CHÍNH (TÍCH HỢP THỐNG KÊ LỚP)

      const [isAnswerLocked, setIsAnswerLocked] = useState(false);
      const [timeLeft, setTimeLeft] = useState(CONFIG.timeLimitMinutes * 60);
      const [isSubmittingModalOpen, setIsSubmittingModalOpen] = useState(false);
      const [alreadySubmittedModal, setAlreadySubmittedModal] = useState(null);

      const [reviewMode, setReviewMode] = useState(false);

      // State hiển thị thống kê điểm theo lớp

      const timerRef = useRef(null);

      useEffect(() => {
        if (screen === 'playing') {
          if (bgmEnabled && soundEnabled) {
            soundManager.startBGM(true);
          }
          timerRef.current = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(timerRef.current);
                handleFinishQuiz();
                return 0;
              }
              if (prev <= 60 && prev % 2 === 0) {
                soundManager.playTick(soundEnabled);
              }
              return prev - 1;
            });
          }, 1000);
        } else {
          clearInterval(timerRef.current);
          soundManager.stopBGM();
        }
        return () => {
          clearInterval(timerRef.current);
          soundManager.stopBGM();
        };
      }, [screen, bgmEnabled, soundEnabled]);

      const handleStartQuiz = (e) => {
        e.preventDefault();
        setValidationError('');
        if (!studentName.trim() || !studentClass.trim()) {
          setValidationError('Vui lòng nhập đầy đủ Họ và tên cùng Lớp học của em!');
          return;
        }

        const studentKey = getStudentKey(studentName, studentClass);

        // KIỂM TRA ĐIỀU KIỆN: MỖI HỌC SINH CHỈ ĐƯỢC LÀM 1 LẦN

          soundManager.playWrong(soundEnabled);
          setAlreadySubmittedModal(SUBMITTED_STUDENTS_REGISTRY[studentKey]);
          return;
        }

        soundManager.init();
        setUserAnswers({});
        setCurrentQIndex(0);
        setIsAnswerLocked(false);
        setTimeLeft(CONFIG.timeLimitMinutes * 60);
        setReviewMode(false);
        setScreen('playing');
        soundManager.playCorrect(soundEnabled);
      };

      const handleSelectOption = (idx) => {
        if (isAnswerLocked) return;
        const newAnswers = { ...userAnswers, [currentQIndex]: idx };
        setUserAnswers(newAnswers);
        setIsAnswerLocked(true);

        const curQ = QUESTIONS_DATA[currentQIndex];
        if (idx === curQ.correct) {
          soundManager.playCorrect(soundEnabled);
        } else {
          soundManager.playWrong(soundEnabled);
        }
      };

      const handleNextQuestion = () => {
        if (currentQIndex < CONFIG.totalQuestions - 1) {
          const nextIndex = currentQIndex + 1;
          setCurrentQIndex(nextIndex);
          setIsAnswerLocked(userAnswers[nextIndex] !== undefined);
        }
      };

      const handleFinishQuiz = () => {
        soundManager.stopBGM();
        setIsSubmittingModalOpen(false);

        const correctCount = getCorrectCount();
        const score = (correctCount * CONFIG.pointsPerQuestion).toFixed(1);
        const percent = Math.round((correctCount / CONFIG.totalQuestions) * 100);
        const isPass = percent > CONFIG.passingPercentage;

        // GHI NHẬN VÀO HỆ THỐNG THỐNG KÊ (KHÓA LÀM LẠI THEO HỌC SINH)
        const studentKey = getStudentKey(studentName, studentClass);
        SUBMITTED_STUDENTS_REGISTRY[studentKey] = {
          name: studentName.trim(),
          studentClass: studentClass.trim().toUpperCase(),
          score: parseFloat(score),
          correctCount: correctCount,
          percentage: percent,
          isPass: isPass,
          submittedAt: new Date().toLocaleTimeString('vi-VN') + " - " + new Date().toLocaleDateString('vi-VN')
        };

        setStatsRegistryVersion(v => v + 1);

        setScreen('result');
        if (isPass) {
          soundManager.playCheer(soundEnabled);
          if (window.confetti) {
            window.confetti({ particleCount: 140, spread: 85, origin: { y: 0.6 } });
          }
        }
      };

      const getCorrectCount = () => {
        let count = 0;
        QUESTIONS_DATA.forEach((q, idx) => {
          if (userAnswers[idx] === q.correct) count++;
        });
        return count;
      };

      const handleDownloadCertificate = () => {
        if (!certificateRef.current || !window.html2canvas) return;
        setDownloadingImg(true);
        window.html2canvas(certificateRef.current, { scale: 2.5, useCORS: true })
          .then(canvas => {
            const link = document.createElement('a');
            link.download = `Chung_Nhan_${studentName.replace(/\s+/g, '_')}_KHTN8.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            setDownloadingImg(false);
          })
          .catch(() => setDownloadingImg(false));
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      };

      // XUẤT DỮ LIỆU ĐIỂM SANG FILE CSV
      const handleExportCSV = (filteredList) => {
        if (!filteredList.length) return;
        let csvContent = "\uFEFF"; // BOM UTF-8
        csvContent += "STT,Họ và tên,Lớp,Điểm số,Số câu đúng,Tỉ lệ %,Xếp loại,Thời gian nộp\n";
        filteredList.forEach((s, i) => {
          const passText = s.isPass ? "Đạt chứng nhận" : "Chưa đạt";
          csvContent += `"${i + 1}","${s.name}","${s.studentClass}","${s.score}","${s.correctCount}/${CONFIG.totalQuestions}","${s.percentage}%","${passText}","${s.submittedAt}"\n`;
        });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.setAttribute('download', `Bang_Diem_KHTN8_${selectedFilterClass}_${new Date().toLocaleDateString('vi-VN').replace(/\//g, '-')}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const currentQ = QUESTIONS_DATA[currentQIndex];
      const correctAnswersCount = getCorrectCount();
      const finalScore = (correctAnswersCount * CONFIG.pointsPerQuestion).toFixed(1);
      const percentageScore = Math.round((correctAnswersCount / CONFIG.totalQuestions) * 100);
      const isCertificateEligible = percentageScore > CONFIG.passingPercentage;

      const isDark = themeMode === 'dark';

      // Tính toán dữ liệu thống kê lớp
      const allSubmittedStudents = Object.values(SUBMITTED_STUDENTS_REGISTRY);
      const uniqueClasses = Array.from(new Set(allSubmittedStudents.map(s => s.studentClass))).sort();
      const filteredStudents = selectedFilterClass === 'ALL' 
        ? allSubmittedStudents 
        : allSubmittedStudents.filter(s => s.studentClass === selectedFilterClass);

      const statsTotalCount = filteredStudents.length;
      const statsAvgScore = statsTotalCount > 0 
        ? (filteredStudents.reduce((acc, cur) => acc + cur.score, 0) / statsTotalCount).toFixed(2)
        : 0;
      const statsMaxScore = statsTotalCount > 0 
        ? Math.max(...filteredStudents.map(s => s.score)).toFixed(1)
        : 0;
      const statsMinScore = statsTotalCount > 0 
        ? Math.min(...filteredStudents.map(s => s.score)).toFixed(1)
        : 0;
      const statsPassCount = filteredStudents.filter(s => s.isPass).length;
      const statsPassRate = statsTotalCount > 0 
        ? Math.round((statsPassCount / statsTotalCount) * 100) 
        : 0;

                        <button 
                          onClick={handleDownloadCertificate}
                          disabled={downloadingImg}
                          className="px-2.5 sm:px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs flex items-center gap-1 shadow transition active:scale-95"
                        >
                          {downloadingImg ? "Đang xuất..." : "📥 Tải Ảnh PNG"}
                        </button>
                        <button 
                          onClick={() => window.print()}
                          className="px-2.5 sm:px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs flex items-center gap-1 shadow transition active:scale-95"
                        >
                          🖨️ In
                        </button>
                      </div>
                    </div>

                    {/* Mẫu Giấy Chứng Nhận */}
                    <div 
                      id="printable-certificate"
                      ref={certificateRef}
                      className="max-w-3xl mx-auto p-4 sm:p-8 rounded-2xl bg-gradient-to-b from-amber-50 via-white to-amber-100 text-slate-900 border-4 sm:border-8 border-amber-400 shadow-2xl relative overflow-hidden"
                    >
                      <div className="border-2 border-amber-600/50 p-4 sm:p-6 rounded-lg text-center relative">
                        <div className="absolute top-1 left-1 sm:top-2 sm:left-2 text-xl sm:text-2xl text-amber-500">⚜️</div>
                        <div className="absolute top-1 right-1 sm:top-2 sm:right-2 text-xl sm:text-2xl text-amber-500">⚜️</div>
                        <div className="absolute bottom-1 left-1 sm:bottom-2 sm:left-2 text-xl sm:text-2xl text-amber-500">⚜️️</div>
                        <div className="absolute bottom-1 right-1 sm:bottom-2 sm:right-2 text-xl sm:text-2xl text-amber-500">⚜️</div>

                        <div className="text-[10px] sm:text-xs font-black tracking-widest text-amber-700 uppercase mb-1">
                          BỘ MÔN KHOA HỌC TỰ NHIÊN - KHỐI 8
                        </div>

                        <h2 className="text-xl sm:text-3xl md:text-4xl font-calligraphy text-amber-700 font-extrabold mb-1">
                          GIẤY CHỨNG NHẬN VINH DANH
                        </h2>
                        <div className="text-[10px] sm:text-xs uppercase font-extrabold tracking-wider text-slate-600 mb-3 sm:mb-4">
                          HOÀN THÀNH XUẤT SẮC THỬ THÁCH QUIZ 4 ĐÁP ÁN
                        </div>

                        <div className="text-[11px] sm:text-xs italic text-slate-500">Chứng nhận em:</div>
                        <div className="text-xl sm:text-3xl font-extrabold text-indigo-900 my-1 underline decoration-amber-400">
                          {studentName}
                        </div>
                        <div className="text-xs sm:text-sm font-bold text-slate-700 mb-2 sm:mb-3">
                          Học sinh lớp: <span className="text-amber-700">{studentClass}</span>
                        </div>

                        <p className="text-[11px] sm:text-sm text-slate-600 max-w-lg mx-auto mb-3 sm:mb-4 leading-relaxed">
                          Đã xuất sắc đạt điểm số <strong>{finalScore}/{CONFIG.maxScore}</strong> (Tỉ lệ chính xác: <strong>{percentageScore}%</strong>) trong bài kiểm tra trực tuyến chuyên đề <em>{CONFIG.lessonTitle}</em>.
                        </p>

                        <div className="grid grid-cols-2 gap-2 sm:gap-4 mt-4 sm:mt-6 pt-3 sm:pt-4 border-t border-amber-300 text-[11px] sm:text-xs">
                          <div>
                            <div className="text-slate-500">Thời gian hoàn thành</div>
                            <div className="font-bold text-slate-800">{new Date().toLocaleDateString('vi-VN')}</div>
                          </div>
                          <div>
                            <div className="text-slate-500">Giáo viên thiết kế</div>
                            <div className="font-bold text-indigo-950 text-xs sm:text-sm font-calligraphy">Cô {CONFIG.teacherName}</div>
                          </div>
                        </div>
                        <div className="mt-3 sm:mt-4 text-[10px] sm:text-[11px] font-bold text-amber-700 tracking-wide">
                          Xuất Web By JacobDev28
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* Xem lại 20 câu hỏi & Giải thích */}
                {reviewMode && (
                  <div className="mt-6 sm:mt-8 space-y-3 sm:space-y-4">
                    <h3 className="text-sm sm:text-base md:text-lg font-bold text-amber-400 uppercase tracking-wider flex items-center gap-2">
                      <span>📝</span> Chi Tiết 20 Câu Hỏi & Giải Thích Khoa Học
                    </h3>

                    <div className="space-y-3 sm:space-y-4">
                      {QUESTIONS_DATA.map((q, qIdx) => {
                        const userChoice = userAnswers[qIdx];
                        const isCorrect = userChoice === q.correct;
                        return (
                          <div 
                            key={q.id}
                            className={`p-3.5 sm:p-5 rounded-xl border text-left ${bgContainer} ${isCorrect ? 'border-emerald-500/40' : 'border-rose-500/40'}`}
                          >
                            <div className="flex items-center justify-between mb-2">
                              <span className="font-bold text-xs sm:text-sm text-amber-400">
                                Câu {qIdx + 1}: ({q.lesson} - {q.level})
                              </span>
                              <span className={`text-[10px] sm:text-xs px-2 py-0.5 rounded-full font-bold ${isCorrect ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'}`}>
                                {isCorrect ? `Đúng (+${CONFIG.pointsPerQuestion}đ)` : "Chưa đúng (0đ)"}
                              </span>
                            </div>

                            <p className="font-semibold text-xs sm:text-sm md:text-base mb-2.5">{q.question}</p>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-2 mb-2.5 text-xs sm:text-sm">
                              {q.options.map((opt, oIdx) => {
                                let style = 'p-2 rounded-lg border border-slate-700/60 bg-slate-800/40';
                                if (oIdx === q.correct) {
                                  style = 'p-2 rounded-lg border border-emerald-500 bg-emerald-500/20 text-emerald-300 font-bold';
                                } else if (oIdx === userChoice && !isCorrect) {
                                  style = 'p-2 rounded-lg border border-rose-500 bg-rose-500/20 text-rose-300 line-through';
                                }
                                return (
                                  <div key={oIdx} className={style}>
                                    {opt}
                                  </div>
                                );
                              })}
                            </div>

                            <div className="p-2.5 sm:p-3 rounded-lg bg-black/20 text-xs text-slate-300 border border-slate-700/50">
                              <span className="font-bold text-amber-300">Giải thích: </span>
                              {q.explanation}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* ======================================================== */}
          {/* MODAL THỐNG KÊ ĐIỂM THEO LỚP & XUẤT BẢNG ĐIỂM CHI TIẾT */}
          {/* ======================================================== */}
          {isStatsModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-2 sm:p-4">
              <div className={`max-w-3xl w-full max-h-[92vh] flex flex-col rounded-2xl border p-4 sm:p-6 ${bgContainer} shadow-2xl relative`}>
                
                {/* Header Modal Thống Kê */}
                <div className="flex items-center justify-between pb-3 border-b border-slate-700">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">📊</span>
                    <div>
                      <h3 className="text-base sm:text-lg font-bold text-amber-400">
                        Bảng Thống Kê Điểm Thi Theo Lớp
                      </h3>
                      <p className="text-[11px] text-slate-400">
                        Bộ môn Khoa học tự nhiên 8 • Giáo viên: Cô {CONFIG.teacherName}
                      </p>
                      <p className="text-[10px] font-bold text-cyan-400">Xuất Web By JacobDev28</p>
                    </div>
                  </div>
                  <button 
                    onClick={() => setIsStatsModalOpen(false)}
                    className="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold flex items-center justify-center transition"
                  >
                    ✕
                  </button>
                </div>

                {/* Bộ lọc chọn lớp */}
                <div className="py-3 flex flex-wrap items-center justify-between gap-2">
                  <div className="flex items-center gap-2">
                    <label className="text-xs font-bold text-slate-300">Chọn lớp:</label>
                    <select
                      value={selectedFilterClass}
                      onChange={(e) => setSelectedFilterClass(e.target.value)}
                      className={`px-3 py-1.5 rounded-lg border text-xs sm:text-sm font-semibold outline-none ${isDark ? 'bg-slate-800 border-slate-700 text-amber-300' : 'bg-slate-100 border-slate-300 text-slate-800'}`}
                    >
                      <option value="ALL">Tất cả các lớp ({allSubmittedStudents.length} HS)</option>
                      {uniqueClasses.map(cls => {
                        const countInClass = allSubmittedStudents.filter(s => s.studentClass === cls).length;
                        return (
                          <option key={cls} value={cls}>Lớp {cls} ({countInClass} HS)</option>
                        );
                      })}
                    </select>
                  </div>

                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => handleExportCSV(filteredStudents)}
                      disabled={filteredStudents.length === 0}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition ${filteredStudents.length > 0 ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow active:scale-95' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`}
                    >
                      📥 Xuất File Excel (CSV)
                    </button>
                  </div>
                </div>

                {/* Các thẻ chỉ số thống kê */}
                <div className="grid grid-cols-2 sm:grid-cols-5 gap-2 my-2 text-center text-xs">
                  <div className={`p-2.5 rounded-xl border ${isDark ? 'bg-slate-800/70 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                    <span className="text-[10px] text-slate-400 block">Số HS đã thi</span>
                    <span className="text-base sm:text-lg font-extrabold text-white">{statsTotalCount}</span>
                  </div>
                  <div className={`p-2.5 rounded-xl border ${isDark ? 'bg-slate-800/70 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                    <span className="text-[10px] text-slate-400 block">Điểm trung bình</span>
                    <span className="text-base sm:text-lg font-extrabold text-amber-400">{statsAvgScore}</span>
                  </div>
                  <div className={`p-2.5 rounded-xl border ${isDark ? 'bg-slate-800/70 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                    <span className="text-[10px] text-slate-400 block">Điểm cao nhất</span>
                    <span className="text-base sm:text-lg font-extrabold text-emerald-400">{statsMaxScore}</span>
                  </div>
                  <div className={`p-2.5 rounded-xl border ${isDark ? 'bg-slate-800/70 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                    <span className="text-[10px] text-slate-400 block">Điểm thấp nhất</span>
                    <span className="text-base sm:text-lg font-extrabold text-rose-400">{statsMinScore}</span>
                  </div>
                  <div className={`p-2.5 rounded-xl border col-span-2 sm:col-span-1 ${isDark ? 'bg-slate-800/70 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                    <span className="text-[10px] text-slate-400 block">Tỉ lệ đạt khen (&gt;70%)</span>
                    <span className="text-base sm:text-lg font-extrabold text-purple-400">{statsPassRate}%</span>
                  </div>
                </div>

                {/* Bảng danh sách học sinh */}
                <div className="flex-1 overflow-y-auto mt-2 rounded-xl border border-slate-700">
                  {filteredStudents.length === 0 ? (
                    <div className="py-12 text-center text-xs text-slate-400 italic">
                      Chưa có học sinh nào hoàn thành bài thi trong danh mục này.
                    </div>
                  ) : (
                    <table className="w-full text-left text-xs border-collapse">
                      <thead className={`sticky top-0 ${isDark ? 'bg-slate-800 text-slate-300' : 'bg-slate-100 text-slate-700'}`}>
                        <tr className="border-b border-slate-700 font-bold">
                          <th className="py-2.5 px-3 w-10 text-center">STT</th>
                          <th className="py-2.5 px-3">Họ và tên</th>
                          <th className="py-2.5 px-2 text-center">Lớp</th>
                          <th className="py-2.5 px-2 text-center">Điểm số</th>
                          <th className="py-2.5 px-2 text-center">Số câu đúng</th>
                          <th className="py-2.5 px-2 text-center">Tỉ lệ %</th>
                          <th className="py-2.5 px-3 text-center">Kết quả</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        {filteredStudents.map((st, idx) => (
                          <tr key={idx} className={`hover:bg-slate-800/40 transition ${idx % 2 === 0 ? 'bg-transparent' : isDark ? 'bg-slate-900/40' : 'bg-slate-50/50'}`}>
                            <td className="py-2.5 px-3 text-center text-slate-400">{idx + 1}</td>
                            <td className="py-2.5 px-3 font-bold text-white">{st.name}</td>
                            <td className="py-2.5 px-2 text-center font-semibold text-amber-400">{st.studentClass}</td>
                            <td className="py-2.5 px-2 text-center font-extrabold text-amber-400 text-sm">{st.score}</td>
                            <td className="py-2.5 px-2 text-center text-slate-300">{st.correctCount}/{CONFIG.totalQuestions}</td>
                            <td className="py-2.5 px-2 text-center font-bold text-sky-400">{st.percentage}%</td>
                            <td className="py-2.5 px-3 text-center">
                              {st.isPass ? (
                                <span className="inline-block px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 text-[10px] font-bold border border-emerald-500/30">
                                  ✓ Đạt khen
                                </span>
                              ) : (
                                <span className="inline-block px-2 py-0.5 rounded-full bg-slate-700 text-slate-400 text-[10px] font-medium">
                                  Chưa đạt
                                </span>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>

                {/* Footer Modal */}
                <div className="pt-3 mt-2 border-t border-slate-700 flex items-center justify-between">
                  <span className="text-[11px] text-slate-400 italic">
                    * Bảng dữ liệu tự động cập nhật khi mỗi học sinh hoàn tất nộp bài thi.
                  </span>
                  <button
                    onClick={() => setIsStatsModalOpen(false)}
                    className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold transition active:scale-95"
                  >
                    Đóng Bảng
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal thông báo học sinh đã hoàn thành 1 lần trước đó (không dùng alert) */}
          {alreadySubmittedModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className={`max-w-md w-full rounded-2xl border p-5 sm:p-6 ${bgContainer} text-center`}>
                <div className="text-4xl mb-2">🚫</div>
                <h3 className="text-lg sm:text-xl font-bold text-rose-400 mb-2">
                  Đã Có Kết Quả Ghi Nhận!
                </h3>
                
                <p className="text-xs sm:text-sm text-slate-300 mb-4 leading-relaxed">
                  Học sinh <strong>{alreadySubmittedModal.name}</strong> - Lớp <strong>{alreadySubmittedModal.studentClass}</strong> đã hoàn thành bài kiểm tra này vào lúc: <br />
                  <span className="text-amber-300 font-semibold">{alreadySubmittedModal.submittedAt}</span>
                </p>

                <div className="p-3 rounded-xl bg-slate-800/80 border border-slate-700 mb-4 text-xs sm:text-sm text-left">
                  <div className="flex justify-between py-1 border-b border-slate-700">
                    <span className="text-slate-400">Điểm số đã đạt:</span>
                    <span className="font-bold text-amber-400">{alreadySubmittedModal.score} / {CONFIG.maxScore} điểm</span>
                  </div>
                  <div className="flex justify-between py-1">
                    <span className="text-slate-400">Số câu đúng:</span>
                    <span className="font-bold text-emerald-400">{alreadySubmittedModal.correctCount} / {CONFIG.totalQuestions} câu ({alreadySubmittedModal.percentage}%)</span>
                  </div>
                </div>

                <div className="p-2 rounded-lg bg-rose-500/10 border border-rose-500/30 text-[11px] text-rose-300 mb-4">
                  ⚠️ Theo quy định của Cô {CONFIG.teacherName}, mỗi học sinh chỉ được làm bài <strong>01 lần duy nhất</strong>. Không cho phép làm lại!
                </div>

                <button
                  onClick={() => setAlreadySubmittedModal(null)}
                  className="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs sm:text-sm transition active:scale-95"
                >
                  Đã Hiểu & Quay Lại
                </button>
              </div>
            </div>
          )}

          {/* Modal xác nhận nộp bài */}
          {isSubmittingModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-sm p-4">
              <div className={`max-w-md w-full rounded-2xl border p-5 sm:p-6 ${bgContainer}`}>
                <h3 className="text-lg sm:text-xl font-bold text-amber-400 mb-2 flex items-center gap-2">
                  <span>⚠️</span> Xác Nhận Nộp Bài?
                </h3>
                
                <p className="text-xs sm:text-sm text-slate-300 mb-4 leading-relaxed">
                  Em đã hoàn thành <strong className="text-emerald-400">{Object.keys(userAnswers).length}</strong> / <strong>{CONFIG.totalQuestions}</strong> câu hỏi.
                  {CONFIG.totalQuestions - Object.keys(userAnswers).length > 0 && (
                    <span className="text-rose-400 block mt-2 font-semibold">
                      Lưu ý: Còn {CONFIG.totalQuestions - Object.keys(userAnswers).length} câu chưa chọn đáp án (sẽ tính là 0 điểm).
                    </span>
                  )}
                  <span className="text-amber-300 block mt-2 font-medium">
                    Sau khi nộp, hệ thống sẽ khóa bài thi của em ngay lập tức và lưu vào bảng điểm lớp!
                  </span>
                </p>

                <div className="flex items-center justify-end gap-2.5">
                  <button
                    onClick={() => setIsSubmittingModalOpen(false)}
                    className="px-4 py-2 rounded-xl border border-slate-700 hover:bg-slate-800 text-xs font-bold transition active:scale-95"
                  >
                    Làm Tiếp
                  </button>
                  <button
                    onClick={handleFinishQuiz}
                    className="px-4 sm:px-5 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-extrabold text-xs uppercase tracking-wider transition shadow-lg shadow-rose-600/30 active:scale-95"
                  >
                    Xác Nhận Nộp Bài
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer thông tin giáo viên */}
          <footer className={`py-2.5 sm:py-3 px-4 border-t text-center text-xs backdrop-blur-md ${isDark ? 'border-slate-800/80 bg-slate-950/80 text-slate-400' : 'border-indigo-100 bg-white/80 text-slate-600'}`}>
            <div className="font-semibold text-amber-400 tracking-wide text-xs sm:text-sm">
              Giáo viên thiết kế: Cô {CONFIG.teacherName}
            </div>
            <div className="text-[10px] text-slate-500 mt-0.5">
              Phần mềm kiểm tra trắc nghiệm trực tuyến môn Khoa học tự nhiên 8 • Tối ưu di động
            </div>
            <div className="text-[11px] sm:text-xs font-bold text-cyan-400 mt-1 tracking-wide">
              Xuất Web By JacobDev28
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
