        if (this.muted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const chords = [
            { f: 523.25, t: 0.0, d: 0.15 },
            { f: 659.25, t: 0.12, d: 0.15 },
            { f: 783.99, t: 0.24, d: 0.2 },
            { f: 1046.5, t: 0.42, d: 0.6 }
          ];
          const now = this.ctx.currentTime;
          chords.forEach(c => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const st = now + c.t;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(c.f, st);
            gain.gain.setValueAtTime(0, st);
            gain.gain.linearRampToValueAtTime(0.2, st + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, st + c.d);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(st);
            osc.stop(st + c.d);
          });
        } catch(e){}
      }
    };

    function checkShortAnswerMatch(input, q) {
      if (!input) return false;
      const clean = input.toLowerCase().trim().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g, '').replace(/\s+/g, ' ');
      return q.acceptedAnswers.some(ans => {
        const cleanAns = ans.toLowerCase().trim().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g, '').replace(/\s+/g, ' ');

                <li>Bài 30: Khái quát về cơ thể người</li>
                <li>Bài 31: Hệ vận động ở người</li>
                <li>Bài 32: Dinh dưỡng và tiêu hóa ở người</li>
                <li>Bài 33: Máu và hệ tuần hoàn ở người</li>
              </ul>
              <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-1">
                <div class="font-bold text-amber-400">Thang điểm: 0,25 đ / mỗi ý hoặc câu đúng (Tổng 10,00 đ)</div>
                <div>• 18 câu trắc nghiệm: 18 x 0,25 = 4,50 đ</div>
                <div>• 3 câu đúng-sai (12 ý): 12 x 0,25 = 3,00 đ</div>
                <div>• 10 câu trả lời ngắn: 10 x 0,25 = 2,50 đ</div>
              </div>
              <div class="p-3 bg-slate-950/70 border border-cyan-900/40 rounded-xl text-xs space-y-1 text-slate-300">
                <div class="font-bold text-cyan-300">⏱️ Đồng hồ đếm ngược từng câu:</div>
                <div>• <strong>Trắc nghiệm (Dạng 1):</strong> <strong>20 - 30 giây</strong> tùy độ khó (Nhận biết: 20s · Thông hiểu: 25s · Vận dụng: 30s)</div>
                <div>• <strong>Đúng - Sai (Dạng 2):</strong> 50 giây cho 4 nhận định độc lập</div>
                <div>• <strong>Trả lời ngắn (Dạng 3):</strong> 40 giây cho mỗi câu</div>
              </div>
            </div>
            <div class="mt-6 flex justify-end">
              <button onclick="goTo('home')" class="px-5 py-2 rounded-xl bg-slate-800 text-xs font-bold text-white">ĐÓNG</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderLeaderboardScreen() {
      const sorted = [...state.attempts].sort((a,b) => b.totalScore !== a.totalScore ? b.totalScore - a.totalScore : a.totalDurationSeconds - b.totalDurationSeconds);
      return `
        <div class="flex-1 max-w-3xl mx-auto px-4 py-8">
          <div class="rounded-2xl border border-slate-800 bg-slate-900 p-6">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">🏆 BẢNG VÀNG THÀNH TÍCH (${sorted.length})</h2>
            ${sorted.length > 0 ? `
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                  <tr class="border-b border-slate-800 text-slate-400 uppercase font-semibold">
                    <th class="py-2">Hạng</th><th class="py-2">Học sinh</th><th class="py-2">Lớp</th><th class="py-2 text-right">Điểm</th><th class="py-2 text-right">Thời gian</th>
                  </tr>
                  ${sorted.map((att, idx) => `
                    <tr class="border-b border-slate-800/40">
                      <td class="py-2 font-bold">${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '#' + (idx + 1)}</td>
                      <td class="py-2 font-semibold text-white">${att.student.fullName}</td>
                      <td class="py-2"><span class="px-1.5 py-0.5 rounded bg-slate-800 text-cyan-300">${att.student.className}</span></td>
                      <td class="py-2 text-right font-bold text-amber-300">${att.totalScore.toFixed(2)}đ</td>
                      <td class="py-2 text-right text-slate-400 font-mono">${formatTime(att.totalDurationSeconds)}</td>
                    </tr>
                  `).join('')}
                </table>
              </div>
            ` : '<div class="py-8 text-center text-slate-500 text-xs">Chưa có kết quả nào được ghi nhận.</div>'}
            <div class="mt-4 flex justify-end">
              <button onclick="goTo('home')" class="px-5 py-2 rounded-xl bg-slate-800 text-xs font-bold text-white">ĐÓNG</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderTeacherScreen() {
      const sorted = [...state.attempts].sort((a,b) => b.totalScore !== a.totalScore ? b.totalScore - a.totalScore : a.totalDurationSeconds - b.totalDurationSeconds);
      
      // Calculate class stats
      const classMap = {};
      state.attempts.forEach(a => {
        const c = a.student.className || 'Chưa rõ';
        if (!classMap[c]) classMap[c] = [];
        classMap[c].push(a);
      });

      const classList = Object.keys(classMap).sort();

      return `
        <div class="flex-1 max-w-5xl mx-auto px-4 py-8">
          <div class="rounded-2xl border border-slate-800 bg-slate-900 p-6 mb-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-6">
              <div>
                <h2 class="text-lg font-bold text-white">🛡️ KHU VỰC QUẢN TRỊ GIÁO VIÊN</h2>
                <p class="text-xs text-slate-400">Đã lưu trữ ${state.attempts.length}/250 thí sinh · 0,25đ / ý đúng</p>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <button onclick="exportCSV()" class="px-3 py-1.5 rounded-lg bg-emerald-600 text-xs font-bold text-white hover:bg-emerald-500">
                  📥 Xuất Excel Cá Nhân
                </button>
                <button onclick="exportClassReport()" class="px-3 py-1.5 rounded-lg bg-cyan-600 text-xs font-bold text-white hover:bg-cyan-500">
                  📊 Xuất Excel Theo Lớp
                </button>
                <button onclick="clearData()" class="px-3 py-1.5 rounded-lg bg-rose-600 text-xs font-bold text-white hover:bg-rose-500">
                  🗑️ Xóa toàn bộ
                </button>
                <button onclick="goTo('home')" class="px-3 py-1.5 rounded-lg bg-slate-800 text-xs font-bold text-slate-300">
                  ✕ Đóng
                </button>
              </div>
            </div>

            <!-- Class Stats Table -->
            <div class="mb-6">
              <h3 class="text-sm font-bold text-amber-400 mb-2">BẢNG TỔNG HỢP THEO LỚP</h3>
              ${classList.length > 0 ? `
                <div class="overflow-x-auto border border-slate-800 rounded-xl mb-4">
                  <table class="w-full text-left text-xs">
                    <tr class="bg-slate-950 border-b border-slate-800 text-slate-400 font-semibold">
                      <th class="py-2 px-3">Lớp</th><th class="py-2 px-3 text-center">Sĩ số</th><th class="py-2 px-3 text-right">Điểm TB</th><th class="py-2 px-3 text-right">Cao nhất</th><th class="py-2 px-3 text-right">Thấp nhất</th>
                    </tr>
                    ${classList.map(cls => {
                      const list = classMap[cls];
                      const scores = list.map(x => x.totalScore);
                      const avg = (scores.reduce((a,b)=>a+b, 0) / list.length).toFixed(2);
                      const max = Math.max(...scores).toFixed(2);
                      const min = Math.min(...scores).toFixed(2);
                      return `
                        <tr class="border-b border-slate-800/40">
                          <td class="py-2 px-3 font-bold text-cyan-300">${cls}</td>
                          <td class="py-2 px-3 text-center">${list.length}</td>
                          <td class="py-2 px-3 text-right font-bold text-amber-300">${avg}</td>
                          <td class="py-2 px-3 text-right text-emerald-400">${max}</td>
                          <td class="py-2 px-3 text-right text-rose-400">${min}</td>
                        </tr>
                      `;
                    }).join('')}
                  </table>
                </div>
              ` : '<p class="text-xs text-slate-500 mb-4">Chưa có dữ liệu theo lớp.</p>'}
            </div>

            <!-- Individual Student Table -->
            <h3 class="text-sm font-bold text-cyan-400 mb-2">BẢNG ĐIỂM CHI TIẾT HỌC SINH</h3>
            ${sorted.length > 0 ? `
              <div class="overflow-x-auto max-h-80 border border-slate-800 rounded-xl">
                <table class="w-full text-left text-xs">
                  <thead class="sticky top-0 bg-slate-900 border-b border-slate-800 text-slate-400 font-semibold">
                    <tr><th class="py-2 px-3">Hạng</th><th class="py-2 px-3">Họ tên</th><th class="py-2 px-3">Lớp</th><th class="py-2 px-3">Mã số tự động</th><th class="py-2 px-3 text-right">Điểm (/10)</th><th class="py-2 px-3 text-right">Thời gian</th></tr>
                  </thead>
                  <tbody>
                    ${sorted.map((att, idx) => `
                      <tr class="border-b border-slate-800/40">
                        <td class="py-2 px-3 font-bold">#${idx + 1}</td>
                        <td class="py-2 px-3 text-white font-medium">${att.student.fullName}</td>
                        <td class="py-2 px-3">${att.student.className}</td>
                        <td class="py-2 px-3 font-mono text-slate-400">${att.student.studentId}</td>
                        <td class="py-2 px-3 text-right font-bold text-amber-300">${att.totalScore.toFixed(2)}</td>
                        <td class="py-2 px-3 text-right font-mono text-slate-400">${formatTime(att.totalDurationSeconds)}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            ` : '<div class="py-8 text-center text-slate-500 text-xs">Chưa có dữ liệu thí sinh.</div>'}
          </div>
        </div>
      `;
    }

    function goTo(scr) {
      AudioEngine.click();
      state.screen = scr;
      render();
    }

    function toggleAudio() {
      AudioEngine.muted = !AudioEngine.muted;
      render();
    }

    function startApp() {
      AudioEngine.click();
      state.screen = 'info';
      render();
    }

    function submitStudentInfo(e) {
      e.preventDefault();
      AudioEngine.click();
      const cls = document.getElementById('infoClass').value.trim().toUpperCase();
      const autoId = 'HS-' + cls + '-' + Math.floor(100 + Math.random() * 900);
      state.student = {
        fullName: document.getElementById('infoName').value.trim(),
        className: cls,
        studentId: autoId
      };
      state.currentIndex = 0;
      state.currentPoints = 0;
      state.elapsedSeconds = 0;
      state.answers = {};
      resetCurrentQuestion();
      state.screen = 'quiz';

      if (state.timerInterval) clearInterval(state.timerInterval);
      state.timerInterval = setInterval(() => {
        state.elapsedSeconds++;
      }, 1000);

      startQuestionTimer();
      render();
    }

    function resetCurrentQuestion() {
      state.selectedMCQ = null;
      state.tfSelections = { a: null, b: null, c: null, d: null };
      state.shortInput = '';
      state.isSubmitted = false;
      state.feedback = null;
    }

    function getQuestionDuration(q) {
      if (q.type === 'mcq') {
        if (q.level === 'nhan_biet') return 20;
        if (q.level === 'thong_hieu') return 25;
        return 30; // van_dung
      }
      if (q.type === 'true_false') return 50;
      return 40; // short_answer
    }

    function startQuestionTimer() {
      const q = QUESTIONS[state.currentIndex];
      state.questionTimer = getQuestionDuration(q);
      if (state.qTimerInterval) clearInterval(state.qTimerInterval);
      state.qTimerInterval = setInterval(() => {
        if (state.questionTimer > 0) {
          state.questionTimer--;
          render();
        }
      }, 1000);
    }

    function selectMCQ(key) {
      if (state.isSubmitted) return;
      AudioEngine.click();
      state.selectedMCQ = key;
      render();
    }

    function setTF(stmtId, val) {
      if (state.isSubmitted) return;
      AudioEngine.click();
      state.tfSelections[stmtId] = val;
      render();
    }

    function canSubmit() {
      const q = QUESTIONS[state.currentIndex];
      if (state.isSubmitted) return false;
      if (q.type === 'mcq') return state.selectedMCQ !== null;
      if (q.type === 'true_false') return ['a','b','c','d'].every(k => state.tfSelections[k] !== null);
      if (q.type === 'short_answer') return (document.getElementById('shortAnsInput')?.value || state.shortInput).trim().length > 0;
      return false;
    }

    function submitCurrentAnswer() {
      if (!canSubmit()) return;
      const q = QUESTIONS[state.currentIndex];
      let earned = 0;
      let right = false;

      if (q.type === 'mcq') {
        right = state.selectedMCQ === q.correctAnswer;
        earned = right ? 0.25 : 0;
      } else if (q.type === 'true_false') {
        let count = 0;
        q.statements.forEach(st => {
          if (state.tfSelections[st.id] === st.correctAnswer) count++;
        });
        earned = Math.round(count * 0.25 * 100) / 100;
        right = count === 4;
      } else if (q.type === 'short_answer') {
        const val = (document.getElementById('shortAnsInput')?.value || state.shortInput).trim();
        state.shortInput = val;
        right = checkShortAnswerMatch(val, q);
        earned = right ? 0.25 : 0;
      }

      if (right || earned > 0) AudioEngine.correct();
      else AudioEngine.incorrect();

      state.currentPoints = Math.round((state.currentPoints + earned) * 100) / 100;
      state.feedback = { isFullyCorrect: right, earned };
      state.isSubmitted = true;
      state.answers[q.id] = { earned, isFullyCorrect: right };
      render();
    }

    function nextQuestion() {
      AudioEngine.click();
      if (state.currentIndex < QUESTIONS.length - 1) {
        state.currentIndex++;
        resetCurrentQuestion();
        startQuestionTimer();
        render();
      } else {
        if (state.timerInterval) clearInterval(state.timerInterval);
        if (state.qTimerInterval) clearInterval(state.qTimerInterval);
        const finalScore = Math.min(10, Math.round(state.currentPoints * 100) / 100);
        saveAttempt({
          id: 'att_' + Date.now(),
          student: state.student,
          completedAt: new Date().toISOString(),
          totalDurationSeconds: state.elapsedSeconds,
          totalScore: finalScore,
          answers: state.answers
        });
        AudioEngine.fanfare();
        state.screen = 'result';
        render();
      }
    }

    function exportCSV() {
      const sorted = [...state.attempts].sort((a,b) => b.totalScore !== a.totalScore ? b.totalScore - a.totalScore : a.totalDurationSeconds - b.totalDurationSeconds);
      const headers = ['Hạng', 'Họ và tên', 'Lớp', 'Mã số HS', 'Điểm (/10)', 'Thời gian'];
      const rows = sorted.map((a, i) => [
        i + 1,
        '"' + a.student.fullName + '"',
        '"' + a.student.className + '"',
        '"' + a.student.studentId + '"',
        a.totalScore.toFixed(2),
        '"' + formatTime(a.totalDurationSeconds) + '"'
      ].join(','));
      const content = '\uFEFF' + [headers.join(','), ...rows].join('\r\n');
      const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Ket_qua_KHTN8_Dau_truong_tri_thuc.csv';
      a.click();
    }

    function exportClassReport() {
      const classMap = {};
      state.attempts.forEach(a => {
        const c = a.student.className || 'Chưa rõ';
        if (!classMap[c]) classMap[c] = [];
        classMap[c].push(a);
      });
      const headers = ['Lớp', 'Sĩ số', 'Điểm TB', 'Cao nhất', 'Thấp nhất'];
      const rows = Object.keys(classMap).sort().map(cls => {
        const list = classMap[cls];
        const scores = list.map(x => x.totalScore);
        const avg = (scores.reduce((a,b)=>a+b, 0) / list.length).toFixed(2);
        const max = Math.max(...scores).toFixed(2);
        const min = Math.min(...scores).toFixed(2);
        return [cls, list.length, avg, max, min].join(',');
      });
      const content = '\uFEFF' + ['BÁO CÁO KẾT QUẢ KHTN 8 THEO LỚP', headers.join(','), ...rows].join('\r\n');
      const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Bao_cao_theo_lop_KHTN8.csv';
      a.click();
    }

    function clearData() {
      if (confirm('Xác nhận xóa toàn bộ danh sách kết quả học sinh?')) {
        state.attempts = [];
        localStorage.removeItem('khtn8_quiz_attempts_v1');
        render();
      }
    }

    render();
  </script>
</body>
</html>
